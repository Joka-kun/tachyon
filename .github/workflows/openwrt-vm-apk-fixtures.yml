name: OpenWrt VM APK fixtures

on:
  push:
    branches: [codex/openwrt-vm-apk-fixtures]

permissions:
  contents: read

jobs:
  package:
    name: Build offline fixture (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            machine: Advanced Micro Devices X86-64
            baseline_sha: 39e84b716eea24987e4e5a82b8b2fb923521702df8f09d1fe063d033353c0e94
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            machine: AArch64
            baseline_sha: d3e33d21e6ff25570cc42cad57f67b00a438fc453dcd458f03845ff42cacdbed
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      RECOVERY_SOURCE: 7498f801a99dfd73e7263913e079673fa3649c38
      PACKAGER_SOURCE: f73a7b5c89e67a853c8cfe77218c5794f3b9c5f7
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      MACHINE: ${{ matrix.machine }}
      BASELINE_SHA256: ${{ matrix.baseline_sha }}
      SOURCE_DATE_EPOCH: '1795737600'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7498f801a99dfd73e7263913e079673fa3649c38
          path: recovery
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f73a7b5c89e67a853c8cfe77218c5794f3b9c5f7
          path: packager
          persist-credentials: false
      - name: Build and verify native musl executable
        working-directory: recovery
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RECOVERY_SOURCE"
          test "$(uname -m)" = "$ARCH"
          rustup toolchain install stable --profile minimal --target "$TARGET"
          TACHYON_BUILD_COMMIT="$RECOVERY_SOURCE" cargo +stable build --locked --release --bin tachyon --target "$TARGET"
          mkdir -p ../fixtures
          install -m 0755 "target/$TARGET/release/tachyon" ../fixtures/tachyon
          LC_ALL=C readelf -h ../fixtures/tachyon | tee ../fixtures/elf.txt
          grep -F "$MACHINE" ../fixtures/elf.txt
          LC_ALL=C readelf -l ../fixtures/tachyon > ../fixtures/program-headers.txt
          ! grep -q INTERP ../fixtures/program-headers.txt
          ../fixtures/tachyon --version
      - name: Package the new executable and verify the published baseline
        working-directory: packager
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PACKAGER_SOURCE"
          python3 tools/build_openwrt_pkg.py --bin ../fixtures/tachyon --arch "$ARCH" \
            --version 2.0.0-rc.6 --out-apk ../fixtures/candidate.apk --out-ipk ../test.ipk
          cd ../fixtures
          curl --fail --location --proto '=https' --retry 2 --silent --show-error \
            "https://github.com/Dushnilin/tachyon/releases/download/v2.0.0-rc.5/tachyon-$ARCH-v2.0.0-rc.5.apk" \
            -o baseline.apk
          printf '%s  %s\n' "$BASELINE_SHA256" baseline.apk | sha256sum -c -
          printf 'recovery=%s\npackager=%s\narch=%s\n' "$RECOVERY_SOURCE" "$PACKAGER_SOURCE" "$ARCH" > build-info.txt
          sha256sum tachyon baseline.apk candidate.apk > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openwrt-vm-native-${{ matrix.arch }}
          path: fixtures/
          if-no-files-found: error
          retention-days: 7

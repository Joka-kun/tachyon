name: Build release-notes LuCI asset
# Rebuild after the bounded release-catalogue search update.

on:
  push:
    branches:
      - qualification/release-notes-asset-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR source branch
        uses: actions/checkout@v4
        with:
          ref: codex/release-notes-selected-tag
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe-app-tachyon/package-lock.json

      - name: Install frontend dependencies
        working-directory: fe-app-tachyon
        run: npm ci

      - name: Format frontend source
        working-directory: fe-app-tachyon
        run: npm run format

      - name: Actualize locale catalogs
        working-directory: fe-app-tachyon
        run: npm run locales:actualize

      - name: Export formatter output for exact PR patch
        run: |
          echo "BEGIN_RELEASE_NOTES_TEST"
          cat fe-app-tachyon/src/tachyon/tabs/updates/tests/releaseNotes.test.ts
          echo "END_RELEASE_NOTES_TEST"

      - name: Run frontend tests
        working-directory: fe-app-tachyon
        run: npm run test -- --run

      - name: Build frontend and generated LuCI views
        working-directory: fe-app-tachyon
        run: npm run build

      - name: Commit only the generated LuCI main.js to the PR branch
        env:
          TARGET_BRANCH: codex/release-notes-selected-tag
        run: |
          set -euo pipefail
          generated="luci-app-tachyon/htdocs/luci-static/resources/view/tachyon/main.js"
          formatted_test="fe-app-tachyon/src/tachyon/tabs/updates/tests/releaseNotes.test.ts"
          locale_files=(
            "fe-app-tachyon/locales/tachyon.pot"
            "fe-app-tachyon/locales/tachyon.ru.po"
            "luci-app-tachyon/po/ru/tachyon.po"
            "luci-app-tachyon/po/templates/tachyon.pot"
          )
          git diff --check
          allowed=("$generated" "$formatted_test" "${locale_files[@]}")
          while IFS= read -r changed; do
            [ -z "$changed" ] && continue
            if [[ ! " ${allowed[*]} " == *" $changed "* ]]; then
              echo "Unexpected file changed during frontend qualification: $changed" >&2
              exit 1
            fi
          done < <(git diff --name-only)
          if git diff --quiet -- "$generated" "$formatted_test" "${locale_files[@]}"; then
            echo "Generated frontend asset, locale catalogs and test formatting are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$generated" "$formatted_test" "${locale_files[@]}"
          git commit -m "build(frontend): refresh LuCI asset and locale catalogs"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

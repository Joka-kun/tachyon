name: Build release-notes LuCI asset

on:
  push:
    branches:
      - qualification/release-notes-asset-build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR source branch
        uses: actions/checkout@v4
        with:
          ref: codex/release-notes-selected-tag
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe-app-tachyon/package-lock.json

      - name: Install frontend dependencies
        working-directory: fe-app-tachyon
        run: npm ci

      - name: Format frontend source
        working-directory: fe-app-tachyon
        run: npm run format

      - name: Export formatter output for exact PR patch
        run: |
          echo "BEGIN_RELEASE_NOTES_TEST"
          cat fe-app-tachyon/src/tachyon/tabs/updates/tests/releaseNotes.test.ts
          echo "END_RELEASE_NOTES_TEST"

      - name: Run frontend tests
        working-directory: fe-app-tachyon
        run: npm run test -- --run

      - name: Build frontend and generated LuCI views
        working-directory: fe-app-tachyon
        run: npm run build

      - name: Commit only the generated LuCI main.js to the PR branch
        env:
          TARGET_BRANCH: codex/release-notes-selected-tag
        run: |
          set -euo pipefail
          generated="luci-app-tachyon/htdocs/luci-static/resources/view/tachyon/main.js"
          formatted_test="fe-app-tachyon/src/tachyon/tabs/updates/tests/releaseNotes.test.ts"
          git diff --check
          if git diff --name-only | grep -Fvx "$generated" | grep -Fvx "$formatted_test" | grep -q .; then
            echo "Unexpected files changed during the frontend build:" >&2
            git diff --name-only >&2
            exit 1
          fi
          if git diff --quiet -- "$generated" "$formatted_test"; then
            echo "Generated LuCI asset and frontend test formatting are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$generated" "$formatted_test"
          git commit -m "build(frontend): refresh LuCI asset and format tests"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

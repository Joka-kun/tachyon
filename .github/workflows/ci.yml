name: CI

on:
  push:
    branches:
      - main
      - master
      - '2.0'
      - product
      - 'qualification/product-upstream-*'
  pull_request:
    branches:
      - main
      - master
      - '2.0'
      - product
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Check, Test & Pure-Rust Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl, i686-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf, arm-unknown-linux-musleabi, riscv64gc-unknown-linux-musl

      - name: Cache Cargo registry and artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: |
          cargo test --all-targets --locked --no-run
          RUST_MIN_STACK=524288 cargo test --all-targets --locked

      - name: Verify service-probe integration prerequisites
        run: |
          command -v python3
          command -v openssl
          command -v curl
          python3 -m py_compile tests/fixtures/service_probe_tls_socks.py

      - name: Verify Pure-Rust dependency tree on musl targets
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            echo "Checking Pure-Rust tree for ${target}..."
            bad="$(cargo tree --target "$target" -e normal,build --prefix none \
              | grep -E '^(cc|cmake|bindgen|ring|aws-lc(-[A-Za-z0-9-]+)?|openssl(-src)?|libz(-sys)?|[A-Za-z0-9_-]+-sys) v' \
              || true)"
            if [[ -n "$bad" ]]; then
              echo "Non-pure-Rust dependencies found for ${target}:" >&2
              printf '%s\n' "$bad" >&2
              exit 1
            fi
          done

      - name: Verify MIPS32 64-bit atomic compatibility
        run: |
          set -euo pipefail
          bad="$(grep -rnE --include='*.rs' '(^|[^A-Za-z0-9_])Atomic[UI]64([^A-Za-z0-9_]|$)' src/ \
            | grep -v -E '^src/store\.rs:.*std::sync::atomic::AtomicU64' \
            || true)"
          if [[ -n "$bad" ]]; then
            echo "Direct 64-bit atomics forbidden outside PortableAtomicU64 in src/store.rs (breaks MIPS32):" >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi

      - name: Check musl cross-compilation targets
        run: |
          cargo check --locked --target x86_64-unknown-linux-musl
          cargo check --locked --target i686-unknown-linux-musl
          cargo check --locked --target aarch64-unknown-linux-musl
          cargo check --locked --target armv7-unknown-linux-musleabihf
          cargo check --locked --target arm-unknown-linux-musleabi
          cargo check --locked --target riscv64gc-unknown-linux-musl

      - name: Build and package real ARMv6/ARMv7 release binaries
        env:
          TACHYON_TARGETS: "armv7-unknown-linux-musleabihf:armv7 arm-unknown-linux-musleabi:armv6"
          TACHYON_BUILD_STD: "0"
          SKIP_FE_BUILD: "1"
        run: bash ./build.sh 2.0.0-ci /tmp/tachyon-arm-packages

  frontend:
    name: Frontend CI & Locale Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe-app-tachyon/package-lock.json

      - name: Install dependencies
        working-directory: fe-app-tachyon
        run: npm ci

      - name: Actualize locales and run frontend CI
        working-directory: fe-app-tachyon
        run: |
          npm run locales:actualize
          npm run ci

      # Product source qualification generates assets without writing to Git.
      # The strict committed-assets check below remains mandatory.
      - name: Capture generated product frontend candidate
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/product' || startsWith(github.ref, 'refs/heads/qualification/product-upstream-'))) || (github.event_name == 'pull_request' && github.base_ref == 'product')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/product-frontend"
          git diff --binary -- fe-app-tachyon/locales luci-app-tachyon/po luci-app-tachyon/htdocs/luci-static/resources/view/tachyon fe-app-tachyon/src/contracts/generated > "$RUNNER_TEMP/product-frontend/generated.patch"
          printf '%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/product-frontend/source-commit.txt"
          cd "$RUNNER_TEMP/product-frontend"
          sha256sum generated.patch source-commit.txt > SHA256SUMS

      - name: Upload generated product frontend candidate
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/product' || startsWith(github.ref, 'refs/heads/qualification/product-upstream-'))) || (github.event_name == 'pull_request' && github.base_ref == 'product')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-generated-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/product-frontend
          if-no-files-found: error
          retention-days: 7

      - name: Ensure generated frontend and locale files are committed
        run: |
          set -euo pipefail
          if git diff -I "POT-Creation-Date" -I "PO-Revision-Date" --quiet -- fe-app-tachyon/locales luci-app-tachyon/po; then
            git checkout -- fe-app-tachyon/locales/*.pot fe-app-tachyon/locales/*.po luci-app-tachyon/po/ 2>/dev/null || true
          fi
          if ! git diff --quiet; then
            echo "Generated frontend or locale files are out of date:" >&2
            git status --short >&2
            git diff --stat >&2
            exit 1
          fi

  shellcheck:
    name: ShellCheck & Packager Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify OpenWrt package service hooks
        run: python3 tools/test_openwrt_service_state.py

      - name: Run ShellCheck on scripts
        run: |
          shellcheck --severity=error \
            build.sh \
            install.sh \
            uninstall.sh \
            openwrt/tachyon.init \
            entware/S99tachyon \
            entware/ndm/netfilter.d/100-tachyon.sh \
            entware/ndm/ifstatechanged.d/100-tachyon.sh \
            entware/ndm/fs.d/100-tachyon.sh \
            .githooks/pre-push

      - name: Verify packager script syntax and packaging tests
        run: |
          python3 -m py_compile tools/build_openwrt_pkg.py tools/build_entware_pkg.py
          python3 tools/test_entware_pkg.py
          python3 tools/test_openwrt_pkg.py

  product_arm64:
    name: Exact product ARM64 package candidate
    needs: [rust, frontend, shellcheck]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/qualification/product-upstream-')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact qualified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source identity and native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = aarch64
          git diff --exit-code

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Build package using existing packager
        env:
          TACHYON_TARGETS: "aarch64-unknown-linux-musl:aarch64"
          TACHYON_BUILD_STD: "0"
          TACHYON_CARGO_EXTRA_ARGS: "--locked"
          TACHYON_BUILD_COMMIT: ${{ github.sha }}
          SKIP_FE_BUILD: "1"
        shell: bash
        run: |
          set -euo pipefail
          bash ./build.sh 2.0.0-ci "$RUNNER_TEMP/product-arm64-build"
          git diff --exit-code
          cd "$RUNNER_TEMP/product-arm64-build"
          sha256sum -c SHA256SUMS

      - name: Bind exact package and ELF evidence
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/product-arm64-candidate"
          mkdir -p "$out"
          bin=target/aarch64-unknown-linux-musl/release/tachyon
          LC_ALL=C readelf -h "$bin" > "$out/elf.txt"
          grep -Eq 'Machine:.*AArch64' "$out/elf.txt"
          LC_ALL=C readelf -l "$bin" > "$out/program-headers.txt"
          if grep -q INTERP "$out/program-headers.txt"; then
            echo DYNAMIC_BINARY_HOLD
            exit 1
          fi
          cp "$RUNNER_TEMP/product-arm64-build/tachyon-aarch64-v2.0.0-ci.apk" "$out/"
          cp "$RUNNER_TEMP/product-arm64-build/tachyon-aarch64-v2.0.0-ci.ipk" "$out/"
          printf 'status=CANDIDATE_NOT_DEPLOYABLE\nsource_commit=%s\narchitecture=aarch64-musl\n' "$(git rev-parse HEAD)" > "$out/build-info.txt"
          printf 'lock_sha256=%s\nbinary_sha256=%s\n' "$(sha256sum Cargo.lock | cut -d' ' -f1)" "$(sha256sum "$bin" | cut -d' ' -f1)" >> "$out/build-info.txt"
          rustc -Vv > "$out/toolchain.txt"
          cd "$out"
          sha256sum tachyon-*.apk tachyon-*.ipk build-info.txt elf.txt program-headers.txt toolchain.txt > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload non-deployable package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-openwrt-aarch64-${{ github.sha }}
          path: ${{ runner.temp }}/product-arm64-candidate
          if-no-files-found: error
          retention-days: 14
